# Scenario 4: Two replicas down — quorum unreachable  (N=3, W=2, R=2)
# Only replica1 is running; it cannot reach W=2 or R=2.
# Expected: errors counter grows, no successful operations.
#
# To stop two replicas after startup:
#   docker compose -f docker-compose.scenario4.yml stop replica2 replica3

services:
  replica1:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8081:8080"

  replica2:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8082:8080"

  replica3:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8083:8080"

  client:
    build: ./client
    environment:
      REPLICAS: "http://replica1:8080"
    depends_on:
      - replica1
      - replica2
      - replica3
