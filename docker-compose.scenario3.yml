# Scenario 3: One replica down — quorum preserved  (N=3, W=2, R=2)
# replica3 is intentionally absent; 2 remaining replicas satisfy W=2 and R=2.
# Expected: ok counter grows, inconsistent and errors stay at 0.
#
# To stop replica3 after startup:
#   docker compose -f docker-compose.scenario3.yml stop replica3

services:
  replica1:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8081:8080"

  replica2:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8082:8080"

  replica3:
    build: ./replica
    environment:
      SERVER_PORT: "8080"
      N: "3"
      W: "2"
      R: "2"
      REPLICATION_DELAY_MAX_MS: "1000"
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    ports:
      - "8083:8080"

  client:
    build: ./client
    environment:
      REPLICAS: "http://replica1:8080,http://replica2:8080,http://replica3:8080"
    depends_on:
      - replica1
      - replica2
      - replica3
